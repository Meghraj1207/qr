<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference QR Generator</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 35px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 230px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 22px;
        }

        .color-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="color"] {
            width: 65px;
            height: 42px;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 2px;
            cursor: pointer;
        }

        .color-value {
            font-family: monospace;
            color: #555;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-row label {
            margin: 0;
            font-weight: normal;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
        }

        .qr-section {
            text-align: center;
        }

        #qr-wrapper {
            display: inline-block;
            padding: 20px;
            border-radius: 8px;
            margin: 10px auto 20px;
        }

        #qrcode {
            display: inline-block;
        }

        #qrcode img,
        #qrcode canvas {
            display: block;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
        }

        .generate-btn {
            background: #222;
            color: white;
        }

        .download-btn {
            background: #16803c;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 15px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Reference QR Generator</h1>

        <div class="subtitle">
            Create a QR code for your pharmaceutical references
        </div>

        <div class="layout">

            <!-- LEFT SIDE -->
            <div>

                <div class="field">
                    <label for="referenceText">
                        References / QR Content
                    </label>

                    <textarea id="referenceText"></textarea>
                </div>

                <div class="field">

                    <label>QR Code Color</label>

                    <div class="color-row">
                        <input
                            type="color"
                            id="qrColor"
                            value="#000000"
                        >

                        <span
                            class="color-value"
                            id="qrColorValue"
                        >#000000</span>
                    </div>

                </div>

                <div class="field">

                    <div class="checkbox-row">

                        <input
                            type="checkbox"
                            id="enableBackground"
                            checked
                        >

                        <label for="enableBackground">
                            Use background color
                        </label>

                    </div>

                </div>

                <div class="field" id="backgroundField">

                    <label>Background Color</label>

                    <div class="color-row">

                        <input
                            type="color"
                            id="backgroundColor"
                            value="#FFFFFF"
                        >

                        <span
                            class="color-value"
                            id="backgroundColorValue"
                        >#FFFFFF</span>

                    </div>

                </div>

                <div class="field">

                    <label for="qrSize">
                        QR Code Size
                    </label>

                    <select id="qrSize">

                        <option value="200">200 × 200 px</option>
                        <option value="300" selected>300 × 300 px</option>
                        <option value="400">400 × 400 px</option>
                        <option value="500">500 × 500 px</option>
                        <option value="600">600 × 600 px</option>

                    </select>

                </div>

                <button
                    class="generate-btn"
                    onclick="generateQR()"
                >
                    Generate QR Code
                </button>

            </div>


            <!-- RIGHT SIDE -->
            <div class="qr-section">

                <h3>Preview</h3>

                <div id="qr-wrapper">

                    <div id="qrcode"></div>

                </div>

                <button
                    class="download-btn"
                    onclick="downloadQR()"
                >
                    Download PNG
                </button>

                <div class="note">
                    Scan the generated QR code to view the references.
                    The QR is generated completely in your browser.
                </div>

            </div>

        </div>

    </div>

</div>


<script>

    let currentCanvas = null;


    // Update displayed color values
    document.getElementById("qrColor").addEventListener("input", function () {

        document.getElementById("qrColorValue").textContent =
            this.value.toUpperCase();

    });


    document.getElementById("backgroundColor").addEventListener("input", function () {

        document.getElementById("backgroundColorValue").textContent =
            this.value.toUpperCase();

    });


    // Show/hide background option
    document.getElementById("enableBackground").addEventListener("change", function () {

        const field = document.getElementById("backgroundField");

        field.style.display = this.checked ? "block" : "none";

    });


    function generateQR() {

        const text =
            document.getElementById("referenceText").value.trim();

        const qrColor =
            document.getElementById("qrColor").value;

        const useBackground =
            document.getElementById("enableBackground").checked;

        const backgroundColor =
            document.getElementById("backgroundColor").value;

        const size =
            parseInt(document.getElementById("qrSize").value);


        if (!text) {

            alert("Please enter reference text.");

            return;
        }


        // Clear previous QR
        document.getElementById("qrcode").innerHTML = "";


        // Generate QR
        const qr = new QRCode(
            document.getElementById("qrcode"),
            {
                text: text,

                width: size,

                height: size,

                colorDark: qrColor,

                colorLight: useBackground
                    ? backgroundColor
                    : "#FFFFFF",

                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );


        // Wait for QRCode.js to create canvas/image
        setTimeout(() => {

            const qrElement =
                document.querySelector("#qrcode canvas");

            currentCanvas = qrElement;

            // Apply preview background
            const wrapper =
                document.getElementById("qr-wrapper");

            if (useBackground) {

                wrapper.style.backgroundColor =
                    backgroundColor;

            } else {

                wrapper.style.backgroundColor =
                    "transparent";

            }

        }, 100);

    }


    function downloadQR() {

        const canvas =
            document.querySelector("#qrcode canvas");

        if (!canvas) {

            alert("Please generate the QR code first.");

            return;
        }


        const useBackground =
            document.getElementById("enableBackground").checked;

        const backgroundColor =
            document.getElementById("backgroundColor").value;

        const size =
            parseInt(document.getElementById("qrSize").value);


        /*
         * Create a larger export canvas.
         * This gives the downloaded PNG a clean border.
         */

        const padding = 30;

        const exportCanvas =
            document.createElement("canvas");

        exportCanvas.width =
            size + padding * 2;

        exportCanvas.height =
            size + padding * 2;


        const ctx =
            exportCanvas.getContext("2d");


        // Background
        if (useBackground) {

            ctx.fillStyle =
                backgroundColor;

            ctx.fillRect(
                0,
                0,
                exportCanvas.width,
                exportCanvas.height
            );

        } else {

            ctx.clearRect(
                0,
                0,
                exportCanvas.width,
                exportCanvas.height
            );

        }


        // Draw QR
        ctx.drawImage(
            canvas,
            padding,
            padding,
            size,
            size
        );


        // Download
        const link =
            document.createElement("a");

        link.download =
            "references_qr.png";

        link.href =
            exportCanvas.toDataURL("image/png");

        link.click();

    }


    // Generate default QR on page load
    window.addEventListener("load", function () {

        generateQR();

    });

</script>

</body>
</html>
